name = "MinaBenchmark"

[deps]
KrylovKit = "0b1a1467-8014-51b9-945f-bf0ae24f4b77"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MPSKit = "bb1c41ca-d63c-52ed-829e-0820dda26502"
MPSKitModels = "ca635005-6f8c-4cd1-b51d-8491250ef2ab"
MatrixAlgebraKit = "6c742aac-3347-4629-af66-fc926824e5e4"
NPZ = "15e1cf62-19b3-5cfa-8e77-841668bca605"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
TensorKit = "07d1fe3e-3e46-537d-9eac-e9e13d0d4cec"
TensorOperations = "6aa20fa7-93e2-5fca-9bc0-fbd0db3c71a2"

# MPSKit is a local clone: it needs branch lb/smaller_mpos for the narrow-MPO
# constructor plus an uncommitted `finalize` patch (FINDINGS section 9). TensorKit
# is not — it comes from the registry (0.17.1, also the newest tag).
#
# For a path-free environment, replace the entry below with a git rev, e.g.
#     MPSKit = {rev = "lb/smaller_mpos", url = "https://github.com/QuantumKitHub/MPSKit.jl.git"}
# and re-resolve; note that loses the local `finalize` patch.
[sources]
MPSKit = {path = "lib/MPSKit.jl"}
